# =================================================================
# AZUL Environment Configuration
# =================================================================
# Central config sourced by all AZUL scripts.
# Every variable is a plain static value — no derivation.
# Edit this file on the file server, then re-sync to targets.
#
# For a new environment: change KUBECONFIG, CLUSTER_IP, all
# hostnames, SERVICE_IP, and credentials.
# =================================================================

# --- Kubernetes Cluster ---
KUBECONFIG="/home/kp-admin/KUBS/kubeconfig"
CLUSTER_IP="192.168.66.201"

# --- Service Hostnames ---
AZUL_HOST="azul.kp.local"
KEYCLOAK_HOST="keycloak-azul.kp.local"
OPENSEARCH_HOST="opensearch-azul.kp.local"
MINIO_HOST="minio-azul.kp.local"
MINIO_API_HOST="minio-api-azul.kp.local"

# --- Service IP (file server + registry on same machine) ---
SERVICE_IP="192.168.66.41"
FILESERVER_PORT="8888"
REGISTRY_PORT="5000"

# --- Backup MinIO (external, on host) ---
BACKUP_MINIO_PORT="9100"
BACKUP_S3_USER="azul-backup"
BACKUP_S3_PASSWORD="azul-backup-secret"
BACKUP_DIR="/data/backups/azul-minio"

# --- Email Domain (for Keycloak user accounts) ---
DOMAIN="kp.local"

# --- AZUL User Accounts ---
TEST_USER="basic"
TEST_PASSWORD="basic12345"
ADMIN_USER="azuladmin"
ADMIN_PASSWORD="admin12345"

# --- Keycloak ---
KC_LOCAL_PORT="18080"

# --- Discord (optional, leave empty to disable) ---
DISCORD_WEBHOOK=""

# --- Export all for subprocesses ---
export KUBECONFIG CLUSTER_IP
export AZUL_HOST KEYCLOAK_HOST OPENSEARCH_HOST MINIO_HOST MINIO_API_HOST
export SERVICE_IP FILESERVER_PORT REGISTRY_PORT
export BACKUP_MINIO_PORT BACKUP_S3_USER BACKUP_S3_PASSWORD BACKUP_DIR
export DOMAIN TEST_USER TEST_PASSWORD ADMIN_USER ADMIN_PASSWORD
export KC_LOCAL_PORT DISCORD_WEBHOOK
