# =================================================================
# AZUL Environment Configuration
# =================================================================
# Central config sourced by all AZUL scripts.
# Override any value by exporting it before running a script,
# or edit this file for your environment.
#
# Defaults match the KUBS homelab cluster.
# For K3s/Rancher prod: change CLUSTER_IP, DOMAIN, KUBECONFIG,
# FILESERVER_IP, and credentials.
# =================================================================

# --- Kubernetes Cluster ---
KUBECONFIG="${KUBECONFIG:-/home/kp-admin/KUBS/kubeconfig}"
CLUSTER_IP="${CLUSTER_IP:-192.168.66.201}"

# --- DNS Domain ---
# All service hostnames are derived from this base domain.
DOMAIN="${DOMAIN:-kp.local}"
AZUL_HOST="${AZUL_HOST:-azul.${DOMAIN}}"
KEYCLOAK_HOST="${KEYCLOAK_HOST:-keycloak-azul.${DOMAIN}}"
OPENSEARCH_HOST="${OPENSEARCH_HOST:-opensearch-azul.${DOMAIN}}"
MINIO_HOST="${MINIO_HOST:-minio-azul.${DOMAIN}}"
MINIO_API_HOST="${MINIO_API_HOST:-minio-api-azul.${DOMAIN}}"

# --- File Server & Registry ---
FILESERVER_IP="${FILESERVER_IP:-192.168.66.41}"
FILESERVER_PORT="${FILESERVER_PORT:-8888}"
REGISTRY_PORT="${REGISTRY_PORT:-5000}"
REGISTRY_UI_PORT="${REGISTRY_UI_PORT:-5001}"
FILESERVER="${FILESERVER:-${FILESERVER_IP}:${FILESERVER_PORT}}"
REGISTRY="${REGISTRY:-${FILESERVER_IP}:${REGISTRY_PORT}}"

# --- Backup MinIO (external, on host) ---
BACKUP_MINIO_PORT="${BACKUP_MINIO_PORT:-9100}"
BACKUP_MINIO_CONSOLE_PORT="${BACKUP_MINIO_CONSOLE_PORT:-9101}"
BACKUP_S3_USER="${BACKUP_S3_USER:-azul-backup}"
BACKUP_S3_PASSWORD="${BACKUP_S3_PASSWORD:-azul-backup-secret}"

# --- Paths ---
AZUL_DIR="${AZUL_DIR:-/data/AZUL}"
BACKUP_DIR="${BACKUP_DIR:-/data/backups/azul-minio}"

# --- AZUL User Accounts ---
# Test user (read-only access)
TEST_USER="${TEST_USER:-basic}"
TEST_PASSWORD="${TEST_PASSWORD:-basic12345}"
# Admin user (full access)
ADMIN_USER="${ADMIN_USER:-azuladmin}"
ADMIN_PASSWORD="${ADMIN_PASSWORD:-admin12345}"

# --- Keycloak ---
KC_LOCAL_PORT="${KC_LOCAL_PORT:-18080}"

# --- Discord (optional) ---
DISCORD_WEBHOOK="${DISCORD_WEBHOOK:-}"

# --- Export all for subprocesses ---
export KUBECONFIG CLUSTER_IP DOMAIN
export AZUL_HOST KEYCLOAK_HOST OPENSEARCH_HOST MINIO_HOST MINIO_API_HOST
export FILESERVER_IP FILESERVER_PORT REGISTRY_PORT FILESERVER REGISTRY
export BACKUP_MINIO_PORT BACKUP_MINIO_CONSOLE_PORT BACKUP_S3_USER BACKUP_S3_PASSWORD
export AZUL_DIR BACKUP_DIR
export TEST_USER TEST_PASSWORD ADMIN_USER ADMIN_PASSWORD
export KC_LOCAL_PORT DISCORD_WEBHOOK
