# AZUL File Server + Docker Registry for offline installation
# Usage: docker compose -f /data/AZUL/docker-compose-fileserver.yaml up -d
# Files:        http://192.168.66.41:8888
# Registry:     http://192.168.66.41:5000
# Registry UI:  http://192.168.66.41:5001

services:
  registry:
    image: registry:2
    container_name: azul-registry
    ports:
      - "5000:5000"
    volumes:
      - /data/registry:/var/lib/registry
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '["http://192.168.66.41:5001"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '["HEAD","GET","OPTIONS","DELETE"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '["Authorization","Accept","Cache-Control"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '["Docker-Content-Digest"]'
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: azul-registry-ui
    ports:
      - "5001:80"
    environment:
      REGISTRY_TITLE: "AZUL Registry"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
    depends_on:
      - registry
    restart: unless-stopped

  fileserver:
    image: nginx:alpine
    container_name: azul-fileserver
    ports:
      - "8888:80"
    volumes:
      - /data/AZUL:/usr/share/nginx/html/AZUL:ro
    restart: unless-stopped
    command: |
      sh -c 'echo "server { listen 80; root /usr/share/nginx/html; autoindex on; autoindex_exact_size off; location ~ /\\.azul-credentials { return 404; } location ~ /\\.git { return 404; } location ~ /docs/ { return 404; } location ~ /framework\\.log { return 404; } location ~ /\\.gitignore { return 404; } location ~ /CLAUDE\\.md { return 404; } }" > /etc/nginx/conf.d/default.conf && rm -f /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
