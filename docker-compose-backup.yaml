# AZUL Backup MinIO - External S3 target for Azul backup/restore
# Runs OUTSIDE the Kubernetes cluster on the host machine.
# The Azul backup pod (inside the cluster) writes backup data here.
#
# Usage:
#   docker compose -f /data/AZUL/docker-compose-backup.yaml up -d
#   podman-compose -f /data/AZUL/docker-compose-backup.yaml up -d
#
# Ports: 9100 (S3 API), 9101 (Web Console)
# Data:  /data/backups/azul-minio/

services:
  minio-backup:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: azul-backup-minio
    command: server /data --console-address ":9101"
    ports:
      - "9100:9000"
      - "9101:9101"
    environment:
      MINIO_ROOT_USER: azul-backup
      MINIO_ROOT_PASSWORD: azul-backup-secret
    volumes:
      - /data/backups/azul-minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
